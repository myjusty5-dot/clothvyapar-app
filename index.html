 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothVyapar App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-gray-800">ClothVyapar Login</h2>

        <!-- Login Form -->
        <div id="login-section">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password" required />
            </div>

            <button type="button" id="btn-login" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition mb-3 font-semibold">Login</button>

            <div class="flex justify-between text-sm">
                <a href="#" id="link-goto-signup" class="text-blue-600 hover:underline">Create Account</a>
                <a href="#" id="link-goto-forgot" class="text-blue-600 hover:underline">Forgot Password?</a>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-section" style="display: none;" class="mt-4">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">New Email</label>
                <input type="email" id="signup-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Enter your email" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">New Password (min 6 chars)</label>
                <input type="password" id="signup-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Create a password" required />
            </div>

            <button type="button" id="btn-signup" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition mb-3 font-semibold">Sign Up</button>
            <div class="text-center">
                <a href="#" id="link-goto-login1" class="text-sm text-blue-600 hover:underline">Back to Login</a>
            </div>
        </div>

        <!-- Forgot Password Modal -->
        <div id="forgot-password-modal" style="display: none;" class="mt-4">
            <p class="text-xs text-gray-600 mb-3">Enter your account email to receive a password reset link.</p>
            <input type="email" id="reset-email" class="w-full px-3 py-2 border rounded-lg mb-3 text-sm" placeholder="Enter your email" />
            <div class="flex space-x-2 mb-3">
                <button type="button" id="btn-reset" class="w-full bg-blue-600 text-white text-sm py-2 rounded-lg hover:bg-blue-700 font-semibold">Send Reset Link</button>
            </div>
            <div class="text-center">
                <a href="#" id="link-goto-login2" class="text-sm text-blue-600 hover:underline">Back to Login</a>
            </div>
        </div>

        <!-- Update Password Box -->
        <div id="update-password-modal" style="display: none;" class="mt-4 p-4 border-2 border-blue-500 rounded-lg bg-white">
            <h3 class="font-bold text-gray-800 mb-2">Set New Password</h3>
            <input type="password" id="new-password" class="w-full px-3 py-2 border rounded-lg mb-3 text-sm" placeholder="Enter new password (min 6 chars)" />
            <button type="button" id="btn-update-pass" class="w-full bg-green-600 text-white text-sm py-2 rounded-lg hover:bg-green-700 font-semibold">Update Password</button>
        </div>

        <!-- Dashboard View (Shown after login) -->
        <div id="dashboard-section" style="display: none;" class="text-center">
            <p class="text-gray-600 mb-4">Welcome to your ClothVyapar Dashboard!</p>
            <div class="bg-gray-100 p-4 rounded-lg mb-4">
                <p id="user-email-display" class="text-sm font-semibold text-gray-800"></p>
            </div>
            <button type="button" id="btn-logout" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition font-semibold">Logout</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const SUPABASE_URL = 'https://ylmzbyhyguwiipugdxjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uj8pIAiX8r1yvxPzJrBW_w_0RFSFhMz';

        // Safe Supabase initialization across CDN variants
        let supabaseClient;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else if (typeof createClient === 'function') {
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                alert("Error: Supabase library failed to load from CDN. Please refresh the page.");
            }
        } catch (err) {
            alert("Initialization Error: " + err.message);
        }

        function toggleView(sectionId, titleText) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('signup-section').style.display = 'none';
            document.getElementById('forgot-password-modal').style.display = 'none';
            document.getElementById('update-password-modal').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'none';
            
            const targetSection = document.getElementById(sectionId);
            if (targetSection) targetSection.style.display = 'block';
            
            const formTitle = document.getElementById('form-title');
            if (formTitle) formTitle.innerText = titleText;
        }

        function showDashboard(email) {
            toggleView('dashboard-section', 'ClothVyapar POS');
            document.getElementById('user-email-display').innerText = 'Logged in as: ' + email;
        }

        // Event listeners (Prevents inline JavaScript onclick handler failures)
        document.addEventListener('DOMContentLoaded', () => {

            // Navigation Links
            document.getElementById('link-goto-signup').addEventListener('click', (e) => {
                e.preventDefault();
                toggleView('signup-section', 'Create Account');
            });

            document.getElementById('link-goto-forgot').addEventListener('click', (e) => {
                e.preventDefault();
                toggleView('forgot-password-modal', 'Reset Password');
            });

            document.getElementById('link-goto-login1').addEventListener('click', (e) => {
                e.preventDefault();
                toggleView('login-section', 'ClothVyapar Login');
            });

            document.getElementById('link-goto-login2').addEventListener('click', (e) => {
                e.preventDefault();
                toggleView('login-section', 'ClothVyapar Login');
            });

            // Login Button
            document.getElementById('btn-login').addEventListener('click', async () => {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    alert("Please fill in both email and password.");
                    return;
                }

                if (!supabaseClient) return alert("Supabase client not connected.");

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    alert("Login Error: " + error.message);
                } else {
                    showDashboard(data.user.email);
                }
            });

            // Sign Up Button
            document.getElementById('btn-signup').addEventListener('click', async () => {
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                if (!email || !password || password.length < 6) {
                    alert("Please enter a valid email and password (minimum 6 characters).");
                    return;
                }

                if (!supabaseClient) return alert("Supabase client not connected.");

                const { data, error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    alert("Sign Up Error: " + error.message);
                } else {
                    alert("Account created successfully! You can now log in.");
                    toggleView('login-section', 'ClothVyapar Login');
                }
            });

            // Send Reset Link Button
            document.getElementById('btn-reset').addEventListener('click', async () => {
                const email = document.getElementById('reset-email').value;

                if (!email) {
                    alert("Please enter your email address.");
                    return;
                }

                if (!supabaseClient) return alert("Supabase client not connected.");

                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href
                });

                if (error) {
                    alert("Error: " + error.message);
                } else {
                    alert("Password reset email sent! Check your inbox.");
                    toggleView('login-section', 'ClothVyapar Login');
                }
            });

            // Logout Button
            document.getElementById('btn-logout').addEventListener('click', async () => {
                if (supabaseClient) await supabaseClient.auth.signOut();
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';
                toggleView('login-section', 'ClothVyapar Login');
            });

            // Update Password Button
            document.getElementById('btn-update-pass').addEventListener('click', async () => {
                const newPassword = document.getElementById('new-password').value;

                if (!newPassword || newPassword.length < 6) {
                    alert("Password must be at least 6 characters.");
                    return;
                }

                if (!supabaseClient) return alert("Supabase client not connected.");

                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

                if (error) {
                    alert("Error: " + error.message);
                } else {
                    alert("Password updated successfully! You can now log in.");
                    toggleView('login-section', 'ClothVyapar Login');
                }
            });

            // Listen for Auth State changes
            if (supabaseClient) {
                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY') {
                        toggleView('update-password-modal', 'Reset Password');
                    } else if (event === 'SIGNED_IN' && session) {
                        showDashboard(session.user.email);
                    }
                });
            }
        });
    </script>
</body>
</html>
