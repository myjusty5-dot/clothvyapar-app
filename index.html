<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothVyapar App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">ClothVyapar Login</h2>

        <!-- Login Form -->
        <div id="login-section">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password" required />
            </div>

            <button onclick="handleLoginForm()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Login</button>

            <!-- Forgot Password Toggle Link -->
            <div class="mt-4 text-center">
                <a href="#" onclick="toggleForgotPasswordView(event)" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
            </div>
        </div>

        <!-- Forgot Password Modal / Box (Hidden by Default) -->
        <div id="forgot-password-modal" style="display: none;" class="mt-6 p-4 border rounded-lg bg-gray-50">
            <h4 class="font-bold text-gray-800 mb-2">Reset Your Password</h4>
            <p class="text-xs text-gray-600 mb-3">Enter your account email to receive a password reset link.</p>
            <input type="email" id="reset-email" class="w-full px-3 py-2 border rounded-lg mb-3 text-sm" placeholder="Enter your email" />
            <div class="flex space-x-2">
                <button onclick="handleRequestReset()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700">Send Reset Link</button>
                <button onclick="toggleForgotPasswordView(event)" class="bg-gray-300 text-gray-700 text-sm px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
            </div>
        </div>

        <!-- Update Password Box -->
        <div id="update-password-modal" style="display: none;" class="mt-6 p-4 border-2 border-blue-500 rounded-lg bg-white">
            <h3 class="font-bold text-gray-800 mb-2">Set New Password</h3>
            <input type="password" id="new-password" class="w-full px-3 py-2 border rounded-lg mb-3 text-sm" placeholder="Enter new password (min 6 chars)" />
            <button onclick="handleUpdatePassword()" class="w-full bg-green-600 text-white text-sm py-2 rounded-lg hover:bg-green-700">Update Password</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const SUPABASE_URL = 'https://ylmzbyhyguwiipugdxjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uj8pIAiX8r1yvxPzJrBW_w_0RFSFhMz';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLoginForm() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Login Error: " + error.message);
            } else {
                alert("Login successful!");
            }
        }

        function toggleForgotPasswordView(event) {
            event.preventDefault();
            const modal = document.getElementById('forgot-password-modal');
            if (modal) {
                modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
            }
        }

        async function handleRequestReset() {
            const emailInput = document.getElementById('reset-email');
            if (!emailInput) return;
            const email = emailInput.value;

            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.href
            });

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Password reset email sent! Check your inbox.");
                const modal = document.getElementById('forgot-password-modal');
                if (modal) modal.style.display = 'none';
            }
        }

        supabase.auth.onAuthStateChange(async (event) => {
            if (event === 'PASSWORD_RECOVERY') {
                const updateModal = document.getElementById('update-password-modal');
                if (updateModal) updateModal.style.display = 'block';
            }
        });

        async function handleUpdatePassword() {
            const passwordInput = document.getElementById('new-password');
            if (!passwordInput) return;
            const newPassword = passwordInput.value;

            if (!newPassword || newPassword.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            const { error } = await supabase.auth.updateUser({ password: newPassword });

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Password updated successfully! You can now log in.");
                const updateModal = document.getElementById('update-password-modal');
                if (updateModal) updateModal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
